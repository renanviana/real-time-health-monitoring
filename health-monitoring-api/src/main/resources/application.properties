spring.application.name=health-monitoring-api

# Logging configuration (TRACE, DEBUG, INFO, WARN, ERROR, FATAL)
log.level=INFO

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=health-monitoring-consumer
# spring.kafka.consumer.properties.spring.deserializer.trusted.packages=com.renz.brokerkafka.domain.model

# Cassandra configuration
spring.data.cassandra.host=127.0.0.1
spring.data.cassandra.port=9042
spring.data.cassandra.local-datacenter=datacenter1
spring.data.cassandra.keyspace-name=health_monitoring
