services:
  emqx:
    image: emqx:5.8.4
    restart: always
    container_name: emqx
    ports:
      - 1883:1883   # Port MQTT
      - 8083:8083   # Port SSL
      - 8883:8883   # Port WS
      - 8084:8084   # Port WSS
      - 18083:18083 # Port HTTP Server
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: admin123
      EMQX_NODE__NAME: foo_emqx@127.0.0.1
    networks:
      - health_monitoring_network
  kafka:
    image: apache/kafka:3.7.2
    container_name: kafka
    ports:
      - 9092:9092
      - 9093:9093
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_INTERNAL://0.0.0.0:9092,PLAINTEXT_EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_INTERNAL://kafka:9092,PLAINTEXT_EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LISTENER_NAME_INTERNAL: PLAINTEXT_INTERNAL
      KAFKA_LISTENER_NAME_EXTERNAL: PLAINTEXT_EXTERNAL
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
    networks:
      - health_monitoring_network
  kafdrop:
    depends_on:
      - kafka
    image: obsidiandynamics/kafdrop:4.1.0
    container_name: kafdrop
    ports:
      - 9000:9000
    environment:
      KAFKA_BROKERCONNECT: kafka:9092
      SERVER_SERVLET_CONTEXTPATH: /
    networks:
      - health_monitoring_network
  cassandra:
    image: cassandra:5.0.2
    container_name: cassandra
    restart: always
    ports:
      - 9042:9042
    environment:
      CASSANDRA_SEEDS: cassandra
      # CASSANDRA_SKIP_WAIT_FOR_GOSSIP_TO_SETTLE: 0
      CASSANDRA_CLUSTER_NAME: HealthMonitoringCluster
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      CASSANDRA_HOST: cassandra
      CASSANDRA_LISTENER_INTERNAL: cassandra:9042
      CASSANDRA_LISTENER_EXTERNAL: localhost:9042
      CASSANDRA_LISTENER_INTERFACES: INTERNAL,EXTERNAL
      CASSANDRA_AUTO_BOOTSTRAP: false
      CASSANDRA_SKIP_WAIT_FOR_GOSSIP_TO_SETTLE: 1
      CASSANDRA_MIGRATION: false
    healthcheck:
      test: ["CMD", "cqlsh", "-e", "DESCRIBE KEYSPACES"]
      interval: 10s
      retries: 5
      start_period: 30s
    networks:
      - health_monitoring_network
  iot_devices_simulator:
    build: iot-devices-simulator
    image: iot-devices-simulator:latest
    container_name: iot_devices_simulator
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    ports:
      - 8000:8000
    networks:
      - health_monitoring_network
  health_monitoring_producer_data:
    depends_on:
      - emqx
      - kafka
    build: health-monitoring-producer-data
    image: health_monitoring_producer_data:latest
    command: java -Dspring.profiles.active=docker -jar target/health-monitoring-producer-data-0.0.1-SNAPSHOT.jar
    container_name: health_monitoring_producer_data
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8081/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - health_monitoring_network
  health_monitoring_consumer_data:
    depends_on:
      cassandra:
        condition: service_healthy
      health_monitoring_producer_data:
        condition: service_healthy
    build: health-monitoring-consumer-data
    image: health_monitoring_consumer_data:latest
    command: java -Dspring.profiles.active=docker -jar target/health-monitoring-consumer-data-0.0.1-SNAPSHOT.jar
    container_name: health_monitoring_consumer_data
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://localhost:8082/actuator/health"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s
    networks:
      - health_monitoring_network
  health_monitoring_consumer_api:
    depends_on:
      health_monitoring_consumer_data:
        condition: service_healthy
    build: health-monitoring-consumer-api
    image: health_monitoring_consumer_api:latest
    command: java -Dspring.profiles.active=docker -jar target/health-monitoring-consumer-api-0.0.1-SNAPSHOT.jar
    container_name: health_monitoring_consumer_api
    ports:
      - 8080:8080
    networks:
      - health_monitoring_network
networks:
  health_monitoring_network:
    driver: bridge
