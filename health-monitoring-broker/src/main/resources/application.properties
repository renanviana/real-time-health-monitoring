spring.application.name=health-monitoring-broker

# Logging configuration (TRACE, DEBUG, INFO, WARN, ERROR, FATAL)
log.level=INFO

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9092

# EMQX Broker configuration
broker.emqx.url=tcp://localhost:1883
broker.emqx.client-id=health-monitoring-broker
broker.emqx.timeout=30

# Cassandra configuration
spring.data.cassandra.host=127.0.0.1
spring.data.cassandra.port=9042
spring.data.cassandra.local-datacenter=datacenter1

# IoT Devices Health Monitoring
device.heartbeat=8T4iF,A8pMD,eHrUQ
# device.another_device=ID_1,ID_2,ID_3,[...]
