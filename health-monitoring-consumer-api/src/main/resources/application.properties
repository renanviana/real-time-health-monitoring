spring.application.name=health-monitoring-consumer-api
server.port=8080
management.endpoints.web.exposure.include=*
management.endpoint.metrics.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=5s
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger

# Logging configuration (TRACE, DEBUG, INFO, WARN, ERROR, FATAL)
log.level=INFO

# Kafka configuration
spring.kafka.bootstrap-servers=localhost:9093
spring.kafka.consumer.group-id=health-monitoring-consumer-api
spring.kafka.topics.dlq.name=dead_letter_queue
spring.kafka.topics.devices.name=devices

# Cassandra configuration
spring.data.cassandra.host=localhost
spring.data.cassandra.port=9042
spring.data.cassandra.local-datacenter=datacenter1
spring.data.cassandra.keyspace-name=health_monitoring
